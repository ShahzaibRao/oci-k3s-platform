---
# site.yml — full cluster build. Runs in CI (.github/workflows/ansible.yml).
# Order matters: common -> k3s_server -> k3s_agent
# (Cilium removed 2026-09-28: pod->API failed with Cilium 1.17/1.19.
#  Default flannel+kube-proxy proven working on this OCI VM.)

- name: Base OS prep
  hosts: all
  become: true
  roles:
    - common

- name: Install k3s server (etcd, schedulable)
  hosts: k3s-server
  become: true
  roles:
    - k3s_server

- name: Join k3s agent via node-token
  hosts: k3s-agent
  become: true
  roles:
    - k3s_agent

- name: Install ArgoCD (GitOps)
  hosts: k3s-server
  become: true
  roles:
    - argocd
