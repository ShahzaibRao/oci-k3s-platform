---
# site.yml — full cluster build. Runs in CI (.github/workflows/ansible.yml).
# Order matters: common -> k3s_server -> cilium -> k3s_agent
# (Cilium must be the CNI before the agent joins and workloads land.)

- name: Base OS prep
  hosts: all
  become: true
  roles:
    - common

- name: Install k3s server (etcd, schedulable)
  hosts: k3s-server
  become: true
  roles:
    - k3s_server

- name: Install Cilium CNI (eBPF, Hubble)
  hosts: k3s-server
  become: true
  roles:
    - cilium

- name: Join k3s agent via node-token
  hosts: k3s-agent
  become: true
  roles:
    - k3s_agent
