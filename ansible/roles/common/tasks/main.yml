---
# common — base OS prep, runs on BOTH nodes before anything else.

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl # k3s / cilium install scripts download karte hain
      - ca-certificates # GitHub/OCI endpoints se TLS
      - jq # agle steps mein exact version pinning ke liye
      - gnupg # kabhi repo key add karni pari to
      - open-iscsi # Longhorn block storage ke liye zaroori (host-level iSCSI)
    state: present

# timedatectl ke barabar, sirf builtin modules se (koi extra collection nahi).
- name: Set system timezone
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ system_timezone }}"
    dest: /etc/localtime
    state: link
    force: true

- name: Record timezone in /etc/timezone
  ansible.builtin.copy:
    content: "{{ system_timezone }}\n"
    dest: /etc/timezone
    mode: "0644"

# Host firewall: OCI security list allows all intra-VCN traffic, but the
# Ubuntu image's iptables REJECTs everything except SSH (22). Mirror the
# security list here so nodes can reach each other (k3s API 6443, kubelet
# 10250, flannel VXLAN 8472, etc.). Rules persist via iptables-persistent.
- name: Install iptables-persistent
  ansible.builtin.apt:
    name: iptables-persistent
    state: present

- name: Check if VCN ACCEPT rule exists
  ansible.builtin.command:
    cmd: iptables -C INPUT -s {{ vcn_cidr }} -j ACCEPT
  register: vcn_iptables_check
  changed_when: false
  failed_when: false

- name: Allow intra-VCN traffic in INPUT chain
  ansible.builtin.command:
    cmd: iptables -I INPUT 1 -s {{ vcn_cidr }} -j ACCEPT
  when: vcn_iptables_check.rc != 0
  notify: Save iptables rules

# Traefik Ingress serves HTTP/HTTPS to the public internet.
# The Ubuntu image's iptables REJECTs everything except SSH by default;
# without these rules, argocd.raoshahzaib.site (and future app domains)
# are unreachable from outside the VCN.
- name: Check if HTTP/HTTPS ACCEPT rules exist
  ansible.builtin.command:
    cmd: iptables -C INPUT -p tcp --dport {{ item }} -j ACCEPT
  loop: [80, 443]
  register: web_iptables_check
  changed_when: false
  failed_when: false

- name: Allow HTTP/HTTPS in INPUT chain (for Traefik Ingress)
  ansible.builtin.command:
    cmd: iptables -I INPUT 1 -p tcp --dport {{ item.item }} -j ACCEPT
  loop: "{{ web_iptables_check.results }}"
  when: item.rc != 0
  notify: Save iptables rules
