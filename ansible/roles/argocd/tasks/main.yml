---
# argocd — install ArgoCD via official manifests (not Helm).
# App-of-apps pattern: parent Application manages child apps (cert-manager, Longhorn).
# Installed via Ansible; apps managed via GitOps after bootstrap.

- name: Create argocd namespace
  ansible.builtin.shell:
    cmd: kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
    # shell (not command): pipe requires a shell.
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: argocd_ns
  changed_when: "'created' in argocd_ns.stdout"

- name: Install ArgoCD (pinned version, server-side)
  ansible.builtin.command:
    cmd: >-
      kubectl apply -n argocd --server-side --force-conflicts
      -f https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/install.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: argocd_install
  changed_when: "'created' in argocd_install.stdout or 'configured' in argocd_install.stdout"
  # NOTE: --server-side --force-conflicts is REQUIRED.
  # The ApplicationSet CRD exceeds the 262KB client-side apply annotation limit.

- name: Wait for ArgoCD server to be ready
  ansible.builtin.command:
    cmd: kubectl wait --for=condition=available --timeout=300s deployment/argocd-server -n argocd
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: argocd_wait
  changed_when: false

# TLS is terminated at the Traefik Ingress (see apps/argocd-ingress/).
# argocd-server must serve plain HTTP internally, otherwise Traefik gets
# a redirect loop (port 80 redirects to HTTPS by default).
- name: Check if argocd-server has --insecure flag
  ansible.builtin.command:
    cmd: kubectl get deployment argocd-server -n argocd -o jsonpath='{.spec.template.spec.containers[0].args}'
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: argocd_args
  changed_when: false

- name: Run argocd-server in insecure mode (TLS at Ingress)
  ansible.builtin.command:
    cmd: >-
      kubectl patch deployment argocd-server -n argocd --type='json'
      -p='[{"op": "add", "path": "/spec/template/spec/containers/0/args/-", "value": "--insecure"}]'
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  when: "'--insecure' not in argocd_args.stdout"
  register: argocd_insecure
  changed_when: true

- name: Bootstrap app-of-apps parent Application
  ansible.builtin.command:
    cmd: >-
      kubectl apply -n argocd --server-side
      -f https://raw.githubusercontent.com/ShahzaibRao/oci-k3s-platform/main/argocd/apps/app-of-apps.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: argocd_aoa
  changed_when: "'created' in argocd_aoa.stdout or 'configured' in argocd_aoa.stdout"
  # One-time bootstrap from GitHub (not local file): the workflow checkout
  # may not have the file yet; the URL always reflects merged main.
  # After this, ArgoCD manages child apps itself via Git.
  # The parent app is excluded from its own directory source to avoid a loop.
