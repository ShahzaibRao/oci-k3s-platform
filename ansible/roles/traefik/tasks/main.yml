---
# traefik — install Traefik as DaemonSet with Gateway API support.
# Runs on k3s-server (has kubectl). Uses Helm via binary (no Galaxy collections).
# Design: Traefik DaemonSet, hostPort 80/443 on both nodes; Gateway API
# (Gateway + HTTPRoute), no legacy Ingress.

- name: Check if helm is installed
  ansible.builtin.command: helm version --short
  register: helm_check
  changed_when: false
  failed_when: false

- name: Download helm install script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    dest: /tmp/get-helm.sh
    mode: "0755"
  when: helm_check.rc != 0

- name: Install helm
  ansible.builtin.command:
    cmd: /tmp/get-helm.sh
    creates: /usr/local/bin/helm
  when: helm_check.rc != 0

- name: Check if Gateway API CRDs exist
  ansible.builtin.command:
    cmd: kubectl get crd gateways.gateway.networking.k8s.io
  register: gateway_crd_check
  changed_when: false
  failed_when: false
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Install Gateway API CRDs (standard channel)
  ansible.builtin.command:
    cmd: kubectl apply --server-side -f https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ gateway_api_version }}/standard-install.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  when: gateway_crd_check.rc != 0

- name: Add Traefik Helm repo
  ansible.builtin.command:
    cmd: helm repo add traefik https://traefik.github.io/charts
  changed_when: false
  failed_when: false

- name: Update Helm repos
  ansible.builtin.command:
    cmd: helm repo update
  changed_when: false

- name: Write Traefik Helm values
  ansible.builtin.copy:
    dest: /tmp/traefik-values.yaml
    mode: "0600"
    content: |
      # Managed by Ansible (traefik role) — do not edit by hand.
      # DaemonSet with hostPort 80/443 on both nodes; Gateway API provider.
      deployment:
        kind: DaemonSet
      ports:
        web:
          hostPort: 80
        websecure:
          hostPort: 443
      # ClusterIP, not LoadBalancer: we use hostPort via DaemonSet directly.
      # LoadBalancer would trigger k3s ServiceLB (svclb) which binds host
      # ports 80/443 itself and blocks the DaemonSet pods from scheduling.
      service:
        type: ClusterIP
      providers:
        kubernetesGateway:
          enabled: true
        # Disable Ingress provider — Gateway API only (no legacy Ingress).
        kubernetesIngress:
          enabled: false

- name: Install/upgrade Traefik via Helm
  ansible.builtin.command:
    cmd: >-
      helm upgrade --install traefik traefik/traefik
      --namespace traefik --create-namespace
      --version {{ traefik_chart_version }}
      -f /tmp/traefik-values.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: traefik_helm
  changed_when: "'has been upgraded' in traefik_helm.stdout or 'has been installed' in traefik_helm.stdout"
  # NOTE: no --wait here. On the LoadBalancer->ClusterIP migration, the old
  # svclb pods hold hostPorts 80/443 until the Service type changes; --wait
  # would timeout waiting for DaemonSet pods that cannot schedule yet.
  # Verification is a separate manual step (kubectl get pods -n traefik).

- name: Write GatewayClass and Gateway manifests
  ansible.builtin.copy:
    dest: /tmp/traefik-gateway.yaml
    mode: "0600"
    content: |
      # Managed by Ansible (traefik role) — do not edit by hand.
      apiVersion: gateway.networking.k8s.io/v1
      kind: GatewayClass
      metadata:
        name: traefik
      spec:
        controllerName: traefik.io/gateway-controller
      ---
      apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata:
        name: traefik-gateway
        namespace: traefik
      spec:
        gatewayClassName: traefik
        listeners:
        - name: web
          port: 80
          protocol: HTTP
        # NOTE: HTTPS listener removed. Gateway API requires certificateRefs
        # when TLS mode is Terminate; we have no certs yet (cert-manager is
        # a future milestone). HTTPS will be added back with cert-manager.

- name: Apply GatewayClass and Gateway
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/traefik-gateway.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: gateway_apply
  changed_when: "'created' in gateway_apply.stdout or 'configured' in gateway_apply.stdout"
