---
# k3s_agent — join the agent node to the k3s cluster.
# Runs after k3s_server. Retrieves the server node-token securely
# (never printed, never committed) and joins via the server private IP.

- name: Uninstall existing k3s agent (clean rebuild)
  ansible.builtin.command: /usr/local/bin/k3s-agent-uninstall.sh
  args:
    removes: /usr/local/bin/k3s
  failed_when: false
  # Clean slate: remove stale state from previous installs.

- name: Check installed k3s version
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: k3s_installed_version
  changed_when: false
  failed_when: false

- name: Fail if a different k3s minor version is installed
  ansible.builtin.fail:
    msg: >-
      k3s already installed ({{ k3s_installed_version.stdout | trim }}),
      but k3s_version={{ k3s_version }} is desired.
      Upgrades are explicit — handle manually, then re-run.
  when:
    - k3s_installed_version.rc == 0
    - k3s_version not in k3s_installed_version.stdout

- name: Ensure k3s config dir exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"
  when: k3s_installed_version.rc != 0

- name: Fetch actual token from k3s server
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/token
  delegate_to: "{{ groups['k3s-server'][0] }}"
  register: server_token
  no_log: true

- name: Write node-token file securely (from server's actual token)
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/node-token
    mode: "0600"
    content: "{{ server_token.content | b64decode }}"
  no_log: true
  when: k3s_installed_version.rc != 0
  # Pehle server se slurp hota tha; ab fixed token — DR mein server se fetch nahi ho sakta.

- name: Write k3s agent config
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
    content: |
      # Managed by Ansible (k3s_agent role) — do not edit by hand.
      server: https://{{ hostvars[groups['k3s-server'][0]]['ansible_default_ipv4']['address'] }}:6443
      token-file: /etc/rancher/k3s/node-token
  notify: Restart k3s-agent
  when: k3s_installed_version.rc != 0

- name: Download k3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: "0755"
  when: k3s_installed_version.rc != 0

- name: Install k3s agent
  ansible.builtin.command:
    cmd: /tmp/k3s-install.sh agent
    creates: /usr/local/bin/k3s
  environment:
    # minor pin: script resolves latest v1.36 patch via the release channel
    INSTALL_K3S_CHANNEL: "{{ k3s_version }}"
  # async: install takes minutes; polling is resilient to transient SSH drops
  # (the install continues server-side; Ansible re-attaches on next poll)
  async: 600
  poll: 15
  when: k3s_installed_version.rc != 0

- name: Ensure k3s-agent service is enabled and started
  ansible.builtin.systemd:
    name: k3s-agent
    enabled: true
    state: started
