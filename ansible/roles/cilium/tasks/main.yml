---
# cilium — Cilium CNI (pure eBPF, kube-proxy replacement, Hubble).
# Runs on k3s-server after k3s install. The agent gets cilium-agent
# via DaemonSet automatically when it joins in step 5.

- name: Check if Cilium is installed
  ansible.builtin.command: /usr/local/bin/k3s kubectl -n kube-system get daemonset cilium
  register: cilium_daemonset
  changed_when: false
  failed_when: false
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Resolve latest Cilium patch for v{{ cilium_version }}
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL 'https://api.github.com/repos/cilium/cilium/releases?per_page=30' |
      jq -r '[.[] | select(.prerelease == false) | .tag_name | select(startswith("v{{ cilium_version }}."))] | first'
  args:
    executable: /bin/bash
  register: cilium_exact_version
  changed_when: false
  when: cilium_daemonset.rc != 0

- name: Download Cilium CLI
  ansible.builtin.unarchive:
    src: https://github.com/cilium/cilium-cli/releases/latest/download/cilium-linux-arm64.tar.gz
    dest: /usr/local/bin
    remote_src: true
    creates: /usr/local/bin/cilium
  when: cilium_daemonset.rc != 0

- name: Install Cilium
  ansible.builtin.command:
    cmd: >-
      /usr/local/bin/cilium install
      --version {{ cilium_exact_version.stdout | trim }}
      --set k8sServiceHost={{ ansible_default_ipv4.address }}
      --set k8sServicePort=6443
      --set kubeProxyReplacement=true
      --set ipam.operator.clusterPoolIPv4PodCIDRList={"10.42.0.0/16"}
      --set hubble.relay.enabled=true
      --set hubble.ui.enabled=true
      --wait
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  when: cilium_daemonset.rc != 0
  async: 900
  poll: 15

- name: Wait for Cilium to be ready
  ansible.builtin.command: /usr/local/bin/cilium status --wait --wait-duration 10m
  changed_when: false
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
