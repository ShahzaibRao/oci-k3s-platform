---
# Pinned versions (design doc §6). Bump via PR, never by hand on servers.
k3s_version: "v1.36" # minor pin; install script resolves latest patch via the v1.36 release channel
cilium_version: "1.19" # minor pin; role resolves latest patch via GitHub releases API (1.19.6+ required for K8s 1.36)

# Both nodes are schedulable — no spare capacity, no dedicated control node.
# (k3s-server is NOT tainted; scheduler may place pods on both nodes.)
k3s_server_taints: []

system_timezone: "Asia/Karachi" # logs tumhare local time mein
