# .github/workflows/infra.yml
# Terraform CI/CD — OCI k3s platform (milestone 1: network + compute)
#
# Flow:
#   1. Har push/PR par: fmt check -> init (R2 backend) -> validate -> plan
#   2. Apply SIRF tab hota hai jab tum Actions mein "oci-production"
#      environment ka pending approval accept karo. Koi auto-apply nahi.
#   3. Apply ke baad Ansible inventory auto-generate hoti hai (artifact).

name: infra

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-infra
  cancel-in-progress: false

env:
  TF_VERSION: '1.9.8'
  TF_IN_AUTOMATION: 'true'
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  plan:
    name: fmt / validate / plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      - name: Init (R2 backend)
        run: >
          terraform init -input=false
          -backend-config="bucket=tfstate-k3s"
          -backend-config="key=oci-k3s/terraform.tfstate"
          -backend-config="region=auto"
          -backend-config="endpoints.s3=https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          -backend-config="skip_credentials_validation=true"
          -backend-config="skip_metadata_api_check=true"
          -backend-config="skip_region_validation=true"
          -backend-config="skip_requesting_account_id=true"

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -out=tfplan
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          TF_VAR_tenancy_ocid: ${{ secrets.TF_VAR_TENANCY_OCID }}
          TF_VAR_compartment_id: ${{ secrets.TF_VAR_COMPARTMENT_ID }}
          TF_VAR_ssh_public_key: ${{ secrets.TF_VAR_SSH_PUBLIC_KEY }}
          TF_VAR_admin_cidr: ${{ secrets.TF_VAR_ADMIN_CIDR != '' && secrets.TF_VAR_ADMIN_CIDR || '0.0.0.0/0' }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.TF_VAR_CLOUDFLARE_ZONE_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.TF_VAR_CLOUDFLARE_API_TOKEN }}

      - name: Show plan summary
        run: terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan file
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/tfplan
          retention-days: 7

  apply:
    name: apply (manual approval)
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: oci-production
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Init (R2 backend)
        run: >
          terraform init -input=false
          -backend-config="bucket=tfstate-k3s"
          -backend-config="key=oci-k3s/terraform.tfstate"
          -backend-config="region=auto"
          -backend-config="endpoints.s3=https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          -backend-config="skip_credentials_validation=true"
          -backend-config="skip_metadata_api_check=true"
          -backend-config="skip_region_validation=true"
          -backend-config="skip_requesting_account_id=true"

      - name: Download plan file
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra

      - name: Apply approved plan
        run: terraform apply -input=false tfplan
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          TF_VAR_tenancy_ocid: ${{ secrets.TF_VAR_TENANCY_OCID }}
          TF_VAR_compartment_id: ${{ secrets.TF_VAR_COMPARTMENT_ID }}
          TF_VAR_ssh_public_key: ${{ secrets.TF_VAR_SSH_PUBLIC_KEY }}
          TF_VAR_admin_cidr: ${{ secrets.TF_VAR_ADMIN_CIDR != '' && secrets.TF_VAR_ADMIN_CIDR || '0.0.0.0/0' }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.TF_VAR_CLOUDFLARE_ZONE_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.TF_VAR_CLOUDFLARE_API_TOKEN }}

      - name: Generate Ansible inventory
        run: |
          terraform output -json > tf-outputs.json
          python3 - <<'EOF'
          import json
          pub = json.load(open('tf-outputs.json'))['node_public_ips']['value']
          with open('inventory.ini', 'w') as f:
              for name, ip in pub.items():
                  f.write(f"[{name}]\n{ip} ansible_user=ubuntu\n\n")
          print(open('inventory.ini').read())
          EOF
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          TF_VAR_tenancy_ocid: ${{ secrets.TF_VAR_TENANCY_OCID }}
          TF_VAR_compartment_id: ${{ secrets.TF_VAR_COMPARTMENT_ID }}
          TF_VAR_ssh_public_key: ${{ secrets.TF_VAR_SSH_PUBLIC_KEY }}
          TF_VAR_admin_cidr: ${{ secrets.TF_VAR_ADMIN_CIDR != '' && secrets.TF_VAR_ADMIN_CIDR || '0.0.0.0/0' }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.TF_VAR_CLOUDFLARE_ZONE_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.TF_VAR_CLOUDFLARE_API_TOKEN }}

      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: ansible-inventory
          path: infra/inventory.ini
          retention-days: 30
