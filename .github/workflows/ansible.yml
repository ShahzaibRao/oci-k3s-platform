# ansible.yml — run the k3s playbook from CI.
#
# Trigger: manual "Run workflow" only (clicking it IS the approval).
# The SSH private key comes from the ANSIBLE_SSH_PRIVATE_KEY secret;
# the inventory is the auto-generated ansible/inventory.ini on main.

name: ansible

on:
  workflow_dispatch:

concurrency:
  group: ansible
  cancel-in-progress: false

defaults:
  run:
    working-directory: ansible

jobs:
  site:
    name: ansible-playbook site.yml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install ansible

      - name: Install Galaxy collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ANSIBLE_SSH_PRIVATE_KEY" > ~/.ssh/id_ansible
          chmod 600 ~/.ssh/id_ansible
        env:
          ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}

      - name: Run playbook
        run: ansible-playbook -i inventory.ini site.yml --private-key ~/.ssh/id_ansible

      # Bootstrap for External Secrets Operator: ESO needs OCI API credentials
      # to read from OCI Vault. Created here (not in Git) from CI secrets.
      # Runs via SSH on k3s-server where kubectl + kubeconfig exist.
      # NOTE: env vars are passed explicitly in the ssh command because the
      # heredoc (<<'SSH_EOF') does not inherit the runner's environment.
      # The private key is base64-encoded to survive the SSH transport.
      - name: Create ESO OCI credentials secret
        run: |
          SERVER_IP=$(grep -A1 '\[k3s-server\]' inventory.ini | tail -1 | awk '{print $1}')
          PRIVATEKEY_B64=$(printf '%s' "$OCI_PRIVATE_KEY" | base64 -w0)
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ansible \
            "ubuntu@$SERVER_IP" \
            "TENANCY='$OCI_TENANCY_OCID' USER_OCID='$OCI_USER_OCID' FINGERPRINT='$OCI_FINGERPRINT' PRIVATEKEY_B64='$PRIVATEKEY_B64' bash -s" <<'SSH_EOF'
          set -e
          PRIVATEKEY=$(printf '%s' "$PRIVATEKEY_B64" | base64 -d)
          # All kubectl via sudo with explicit KUBECONFIG (file is root-owned)
          sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl create namespace external-secrets --dry-run=client -o yaml | sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl apply -f -
          sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl create secret generic oci-credentials \
            --namespace external-secrets \
            --from-literal=tenancy="$TENANCY" \
            --from-literal=user="$USER_OCID" \
            --from-literal=fingerprint="$FINGERPRINT" \
            --from-literal=privatekey="$PRIVATEKEY" \
            --dry-run=client -o yaml | sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl apply -f -
          sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl get secret oci-credentials -n external-secrets
          SSH_EOF
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
