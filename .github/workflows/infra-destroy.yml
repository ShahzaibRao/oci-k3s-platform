# .github/workflows/infra-destroy.yml
# Manual, approval-gated teardown of ALL Terraform-managed infrastructure.
#
# DANGER: this deletes the VCN, both VMs, the load balancer, AND the OCI
# Vault with every secret in it. R2 buckets (tfstate-k3s, oci-k3s-etcd,
# oci-k3s-velero) are NOT managed by Terraform and survive.
#
# Flow:
#   1. Actions → infra-destroy → Run workflow → type DESTROY (exactly)
#   2. plan-destroy job: terraform plan -destroy, uploads the destroy plan
#   3. YOU approve the oci-production environment in the Actions run
#   4. destroy job: applies the reviewed destroy plan — nothing else
#
# Before running: take a Velero backup, and confirm every Vault secret's
# value still exists as a GitHub Secret (destroyed secrets only come back
# if their TF_VAR_* source still exists). After an intentional destroy,
# expect drift alerts until infra is recreated (or pause drift.yml).

name: infra-destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DESTROY (all caps) to confirm full teardown'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: terraform-infra
  cancel-in-progress: false

env:
  TF_VERSION: '1.9.8'
  TF_IN_AUTOMATION: 'true'
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  plan-destroy:
    name: plan destroy (preview)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm typed approval
        run: |
          if [ "${{ inputs.confirm }}" != "DESTROY" ]; then
            echo "::error::Type DESTROY exactly (all caps) to confirm teardown. Nothing was planned or destroyed."
            exit 1
          fi
          echo "Confirmation accepted. Planning teardown..."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure OCI auth
        run: |
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_PRIVATE_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          tenancy=$OCI_TENANCY_OCID
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          key_file=$HOME/.oci/oci_api_key.pem
          region=eu-frankfurt-1
          EOF
          chmod 600 ~/.oci/config
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}

      - name: Init (R2 backend)
        run: |
          cat > backend.r2.hcl <<'EOF'
          bucket                      = "tfstate-k3s"
          key                         = "oci-k3s/terraform.tfstate"
          region                      = "auto"
          endpoints = {
            s3 = "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          }
          skip_credentials_validation = true
          skip_metadata_api_check     = true
          skip_region_validation      = true
          skip_requesting_account_id  = true
          EOF
          terraform init -input=false -backend-config=backend.r2.hcl

      - name: Plan destroy
        run: terraform plan -destroy -input=false -out=destroy.plan
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          TF_VAR_tenancy_ocid: ${{ secrets.TF_VAR_TENANCY_OCID }}
          TF_VAR_compartment_id: ${{ secrets.TF_VAR_COMPARTMENT_ID }}
          TF_VAR_ssh_public_key: ${{ secrets.TF_VAR_SSH_PUBLIC_KEY }}
          TF_VAR_admin_cidr: ${{ secrets.TF_VAR_ADMIN_CIDR != '' && secrets.TF_VAR_ADMIN_CIDR || '0.0.0.0/0' }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.TF_VAR_CLOUDFLARE_ZONE_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.TF_VAR_CLOUDFLARE_API_TOKEN }}
          TF_VAR_r2_access_key_id: ${{ secrets.TF_VAR_R2_ACCESS_KEY_ID }}
          TF_VAR_r2_secret_access_key: ${{ secrets.TF_VAR_R2_SECRET_ACCESS_KEY }}
          TF_VAR_creatorwatch_database_url: ${{ secrets.TF_VAR_CREATORWATCH_DATABASE_URL }}
          TF_VAR_creatorwatch_admin_token: ${{ secrets.TF_VAR_CREATORWATCH_ADMIN_TOKEN }}
          TF_VAR_creatorwatch_session_secret: ${{ secrets.TF_VAR_CREATORWATCH_SESSION_SECRET }}
          TF_VAR_creatorwatch_key_secret: ${{ secrets.TF_VAR_CREATORWATCH_KEY_SECRET }}
          TF_VAR_keycloak_database_url: ${{ secrets.TF_VAR_KEYCLOAK_DATABASE_URL }}
          TF_VAR_keycloak_admin_password: ${{ secrets.TF_VAR_KEYCLOAK_ADMIN_PASSWORD }}
          TF_VAR_grafana_oidc_secret: ${{ secrets.TF_VAR_GRAFANA_OIDC_SECRET }}
          TF_VAR_argocd_oidc_secret: ${{ secrets.TF_VAR_ARGOCD_OIDC_SECRET }}
          TF_VAR_grafana_google_client_id: ${{ secrets.TF_VAR_GRAFANA_GOOGLE_CLIENT_ID }}
          TF_VAR_grafana_google_client_secret: ${{ secrets.TF_VAR_GRAFANA_GOOGLE_CLIENT_SECRET }}
          TF_VAR_grafana_admin_password: ${{ secrets.TF_VAR_GRAFANA_ADMIN_PASSWORD }}

      - name: Show destroy plan summary
        run: terraform show -no-color destroy.plan >> "$GITHUB_STEP_SUMMARY"

      - name: Upload destroy plan
        uses: actions/upload-artifact@v4
        with:
          name: destroy-plan
          path: infra/destroy.plan
          retention-days: 7

  destroy:
    name: destroy (manual approval)
    runs-on: ubuntu-latest
    needs: plan-destroy
    environment: oci-production
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure OCI auth
        run: |
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_PRIVATE_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          tenancy=$OCI_TENANCY_OCID
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          key_file=$HOME/.oci/oci_api_key.pem
          region=eu-frankfurt-1
          EOF
          chmod 600 ~/.oci/config
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}

      - name: Init (R2 backend)
        run: |
          cat > backend.r2.hcl <<'EOF'
          bucket                      = "tfstate-k3s"
          key                         = "oci-k3s/terraform.tfstate"
          region                      = "auto"
          endpoints = {
            s3 = "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          }
          skip_credentials_validation = true
          skip_metadata_api_check     = true
          skip_region_validation      = true
          skip_requesting_account_id  = true
          EOF
          terraform init -input=false -backend-config=backend.r2.hcl

      - name: Download destroy plan
        uses: actions/download-artifact@v4
        with:
          name: destroy-plan
          path: infra

      - name: Apply destroy plan
        run: terraform apply -input=false destroy.plan
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          TF_VAR_tenancy_ocid: ${{ secrets.TF_VAR_TENANCY_OCID }}
          TF_VAR_compartment_id: ${{ secrets.TF_VAR_COMPARTMENT_ID }}
          TF_VAR_ssh_public_key: ${{ secrets.TF_VAR_SSH_PUBLIC_KEY }}
          TF_VAR_admin_cidr: ${{ secrets.TF_VAR_ADMIN_CIDR != '' && secrets.TF_VAR_ADMIN_CIDR || '0.0.0.0/0' }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.TF_VAR_CLOUDFLARE_ZONE_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.TF_VAR_CLOUDFLARE_API_TOKEN }}
          TF_VAR_r2_access_key_id: ${{ secrets.TF_VAR_R2_ACCESS_KEY_ID }}
          TF_VAR_r2_secret_access_key: ${{ secrets.TF_VAR_R2_SECRET_ACCESS_KEY }}
          TF_VAR_creatorwatch_database_url: ${{ secrets.TF_VAR_CREATORWATCH_DATABASE_URL }}
          TF_VAR_creatorwatch_admin_token: ${{ secrets.TF_VAR_CREATORWATCH_ADMIN_TOKEN }}
          TF_VAR_creatorwatch_session_secret: ${{ secrets.TF_VAR_CREATORWATCH_SESSION_SECRET }}
          TF_VAR_creatorwatch_key_secret: ${{ secrets.TF_VAR_CREATORWATCH_KEY_SECRET }}
          TF_VAR_keycloak_database_url: ${{ secrets.TF_VAR_KEYCLOAK_DATABASE_URL }}
          TF_VAR_keycloak_admin_password: ${{ secrets.TF_VAR_KEYCLOAK_ADMIN_PASSWORD }}
          TF_VAR_grafana_oidc_secret: ${{ secrets.TF_VAR_GRAFANA_OIDC_SECRET }}
          TF_VAR_argocd_oidc_secret: ${{ secrets.TF_VAR_ARGOCD_OIDC_SECRET }}
          TF_VAR_grafana_google_client_id: ${{ secrets.TF_VAR_GRAFANA_GOOGLE_CLIENT_ID }}
          TF_VAR_grafana_google_client_secret: ${{ secrets.TF_VAR_GRAFANA_GOOGLE_CLIENT_SECRET }}
          TF_VAR_grafana_admin_password: ${{ secrets.TF_VAR_GRAFANA_ADMIN_PASSWORD }}
