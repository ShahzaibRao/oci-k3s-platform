# Pulls Velero R2 credentials from OCI Vault into the velero namespace.
# The target Secret has the SAME name the Helm release already uses,
# so Velero picks it up with no restart needed (it reads the Secret).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: velero-r2-credentials
  namespace: velero
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: velero-r2-credentials
    creationPolicy: Owner
  data:
    - secretKey: cloud
      remoteRef:
        key: velero-r2-credentials
