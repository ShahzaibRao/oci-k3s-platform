# Velero -> Cloudflare R2 (S3-compatible)
# DR target: full cluster rebuild restores PV data from R2.
#
# NOTE: apps/velero/Chart.yaml is a wrapper chart with 'velero' as a
# Helm dependency. All Velero chart values must be nested under the
# 'velero:' key, otherwise Helm applies them to the wrapper (which
# ignores them) and the subchart uses its defaults.
velero:
  configuration:
    backupStorageLocation:
      - name: default
        provider: aws
        bucket: oci-k3s-velero
        config:
          region: auto
          s3ForcePathStyle: "true"
          s3Url: https://70bb4330aeae9769fe3c30a1e167a06d.r2.cloudflarestorage.com
    volumeSnapshotLocation:
      - name: default
        provider: aws
        config:
          region: auto

  # R2 credentials come from the SealedSecret in sealed-secret.yaml
  credentials:
    useSecret: true
    name: velero-r2-credentials

  # Daily backup, 30-day TTL (per DESIGN.md)
  schedules:
    daily-backup:
      schedule: "0 2 * * *"
      template:
        ttl: 720h
        includedNamespaces:
          - argocd
          - cert-manager
          - sealed-secrets

  # Small cluster resources
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

  # Fix: chart defaults to bitnami/kubectl:1.36 which does not exist on
  # Docker Hub (ImagePullBackOff). Pin to a known-good tag.
  kubectl:
    image:
      tag: "1.32.2"

  # Fresh install: CRDs are installed by the chart; no upgrade needed.
  # The upgrade-crds Helm hook Job blocks ArgoCD sync when its image
  # can't be pulled. Disable it.
  upgradeCRDs: false
