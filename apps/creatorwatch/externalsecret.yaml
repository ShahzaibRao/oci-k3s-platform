# Pulls CreatorWatch secrets from OCI Vault into the creatorwatch namespace.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: creatorwatch-secrets
  namespace: creatorwatch
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: creatorwatch-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: creatorwatch-database-url
    - secretKey: admin-token
      remoteRef:
        key: creatorwatch-admin-token
    - secretKey: session-secret
      remoteRef:
        key: creatorwatch-session-secret
    - secretKey: key-secret
      remoteRef:
        key: creatorwatch-key-secret
