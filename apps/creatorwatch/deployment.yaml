apiVersion: apps/v1
kind: Deployment
metadata:
  name: creatorwatch-license
  namespace: creatorwatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: creatorwatch-license
  template:
    metadata:
      labels:
        app: creatorwatch-license
    spec:
      containers:
        - name: license-server
          image: raoshahzaib/creatorwatch-license:v0.5.4
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "5001"
            - name: SITE_DOMAIN
              value: "cw.raoshahzaib.site"
            - name: SITE_NAME
              value: "CreatorWatch"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: creatorwatch-secrets
                  key: database-url
            - name: LICENSE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: creatorwatch-secrets
                  key: admin-token
            - name: LICENSE_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: creatorwatch-secrets
                  key: session-secret
            - name: LICENSE_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: creatorwatch-secrets
                  key: key-secret
