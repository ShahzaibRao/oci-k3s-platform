# Grafana admin password from OCI Vault (separate from OIDC secrets).
# Proved working: fresh ExternalSecret fetches grafana-admin-password successfully.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: grafana-admin-secret
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: grafana-admin-password
  template:
    data:
      admin-user: admin
    engineVersion: v2
    mergePolicy: Replace
