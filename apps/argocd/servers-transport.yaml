# ServersTransport lets Traefik talk HTTPS to the argocd-server backend
# (which uses a self-signed cert). The edge TLS is terminated by Traefik
# using the wildcard cert above; this only affects the internal hop.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: argocd-insecure
  namespace: argocd
spec:
  insecureSkipVerify: true
