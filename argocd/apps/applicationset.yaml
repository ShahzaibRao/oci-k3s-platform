apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: k3s-applications
  namespace: argocd
  # Generates one Application per list element. Each app's manifests live in
  # apps/<name>/ (created by follow-up PRs). Add a name here to onboard
  # a new app — no new YAML file needed.
spec:
  goTemplate: true
  generators:
    - list:
        # Step-by-step: only the current milestone's app is listed.
        # Each PR adds its app name + apps/<name>/ manifests together.
        # cert-manager-crds must sync before cert-manager (CRDs first).
        # Optional 'namespace' overrides the default (which is the app name).
        # Longhorn requires longhorn-system (hardcoded in its chart).
        # Optional 'skipHooks' (true/false) adds SkipHooks sync option.
        # Longhorn's pre-upgrade Job hook gets stuck in ArgoCD; skip it.
        elements:
          - name: cert-manager-crds
          - name: cert-manager
          - name: sealed-secrets
          - name: cloudflare-issuer
          - name: argocd-ingress
            namespace: argocd
          - name: longhorn
            namespace: longhorn-system
            skipHooks: "true"
  template:
    metadata:
      name: "{{ .name }}"
      {{ if eq .skipHooks "true" }}
      annotations:
        argocd.argoproj.io/sync-options: SkipHooks=true
      {{ end }}
    spec:
      project: default
      source:
        repoURL: https://github.com/ShahzaibRao/oci-k3s-platform.git
        targetRevision: main
        path: "apps/{{ .name }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace | default .name }}"
      syncPolicy:
        automated:
          prune: true # remove app when deleted from the list
          selfHeal: true # revert manual changes
        syncOptions:
          - CreateNamespace=true
