apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: k3s-applications
  namespace: argocd
  # Generates one Application per list element. Each app's manifests live in
  # apps/<name>/ (created by follow-up PRs). Add a name here to onboard
  # a new app — no new YAML file needed.
spec:
  goTemplate: true
  generators:
    - list:
        # Step-by-step: only the current milestone's app is listed.
        # Each PR adds its app name + apps/<name>/ manifests together.
        # cert-manager-crds must sync before cert-manager (CRDs first).
        # Optional 'namespace' overrides the default (which is the app name).
        # Storage: k3s built-in local-path-provisioner is the default
        # StorageClass. Longhorn was removed (its pre-upgrade Helm hook
        # gets stuck under ArgoCD); Velero+R2 handles backup/restore for
        # full cluster rebuilds, which is the DR target.
        # Sync waves: 0 = foundation (operators, CRDs, stores),
        # 1 = secrets/issuers/ingress (need foundation),
        # 2 = apps needing secrets (velero Helm chart is static).
        elements:
          - name: cert-manager-crds
            syncWave: "0"
          - name: cert-manager
            syncWave: "0"
          - name: external-secrets
            syncWave: "0"
          - name: cloudflare
            namespace: cert-manager
            syncWave: "1"
          - name: velero-secrets
            namespace: velero
            syncWave: "1"
          - name: argocd
            namespace: argocd
            syncWave: "1"
        # velero and monitoring use static Applications (argocd/apps/*.yaml)
        # with the Helm chart directly — the wrapper-chart pattern caused
        # values to not reach the subchart.
  template:
    metadata:
      name: "{{ .name }}"
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .syncWave | default "0" }}'
    spec:
      project: default
      source:
        repoURL: https://github.com/ShahzaibRao/oci-k3s-platform.git
        targetRevision: main
        path: "apps/{{ .name }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace | default .name }}"
      syncPolicy:
        automated:
          prune: true # remove app when deleted from the list
          selfHeal: true # revert manual changes
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true


