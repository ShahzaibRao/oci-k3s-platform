apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: k3s-applications
  namespace: argocd
  # Generates one Application per list element. Each app's manifests live in
  # apps/<name>/ (created by follow-up PRs). Add a name here to onboard
  # a new app — no new YAML file needed.
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - name: external-secrets
          - name: cert-manager
          - name: longhorn
  template:
    metadata:
      name: "{{ .name }}"
    spec:
      project: default
      source:
        repoURL: https://github.com/ShahzaibRao/oci-k3s-platform.git
        targetRevision: main
        path: "apps/{{ .name }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .name }}"
      syncPolicy:
        automated:
          prune: true # remove app when deleted from the list
          selfHeal: true # revert manual changes
        syncOptions:
          - CreateNamespace=true
