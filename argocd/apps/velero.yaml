apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://vmware-tanzu.github.io/helm-charts
    chart: velero
    targetRevision: 9.0.0
    helm:
      values: |
        configuration:
          backupStorageLocation:
          - bucket: ${R2_BUCKET}
            config:
              region: auto
              s3ForcePathStyle: true
              s3Url: ${R2_ENDPOINT}
            name: default
            provider: aws
          volumeSnapshotLocation:
          - config:
              region: auto
            name: default
            provider: aws
        credentials:
          name: velero-r2-credentials
          useSecret: true
        initContainers:
        - image: velero/velero-plugin-for-aws:v1.10.0
          name: velero-plugin-for-aws
          volumeMounts:
          - mountPath: /target
            name: plugins
        kubectl:
          image:
            tag: 1.32.2
        schedules:
          daily-backup:
            schedule: 0 2 * * *
            template:
              includedNamespaces:
              - argocd
              - cert-manager
              - external-secrets
              ttl: 720h
        upgradeCRDs: false
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
